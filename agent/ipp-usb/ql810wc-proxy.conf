# /etc/ipp-usb/quirks/ql810wc-proxy.conf — installed by ql810wc-print-proxy
# (scripts/20-cups-queue.sh, IPP_USB_EXCLUDE="yes"); removed by uninstall.sh.
#
# Keeps ipp-usb away from the Brother QL label printer, and from nothing else.
# The QL's IPP-over-USB interface is an alternate setting of its raw printer
# interface: while ipp-usb uses it, the kernel usblp driver is unbound and the
# Brother raster that P-touch Editor sends cannot reach the printer.
# ql810wc-proxyd owns the printer instead.
#
# The section name is "<USB manufacturer> <USB product>" of the printer, as
# ipp-usb matches it (detected at install time).
[@IPP_USB_DEVICE@]
  blacklist = true
